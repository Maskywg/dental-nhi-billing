<!DOCTYPE html>
<html>
<body>
<canvas id="c512" width="512" height="512"></canvas>
<canvas id="c180" width="180" height="180"></canvas>
<script>
function drawIcon(canvas, size){
  const ctx = canvas.getContext('2d');
  const r = size * 0.195;
  ctx.beginPath();
  ctx.moveTo(r, 0);
  ctx.lineTo(size-r, 0);
  ctx.quadraticCurveTo(size, 0, size, r);
  ctx.lineTo(size, size-r);
  ctx.quadraticCurveTo(size, size, size-r, size);
  ctx.lineTo(r, size);
  ctx.quadraticCurveTo(0, size, 0, size-r);
  ctx.lineTo(0, r);
  ctx.quadraticCurveTo(0, 0, r, 0);
  ctx.closePath();
  ctx.fillStyle = '#0d9488';
  ctx.fill();

  ctx.font = (size*0.53) + 'px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('🦷', size/2, size*0.44);

  ctx.font = '700 ' + (size*0.175) + 'px "PingFang TC","Microsoft JhengHei",sans-serif';
  ctx.fillStyle = '#ffffff';
  ctx.fillText('健保', size/2, size*0.82);
}

function download(canvas, filename){
  const a = document.createElement('a');
  a.download = filename;
  a.href = canvas.toDataURL('image/png');
  document.body.appendChild(a);
  a.click();
}

const c512 = document.getElementById('c512');
const c180 = document.getElementById('c180');
drawIcon(c512, 512);
drawIcon(c180, 180);

window.onload = function(){
  setTimeout(()=>{
    download(c512, 'icon-512.png');
    setTimeout(()=> download(c180, 'apple-touch-icon.png'), 400);
  }, 300);
};
</script>
</body>
</html>
